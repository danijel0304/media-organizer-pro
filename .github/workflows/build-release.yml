name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r media_organizer_pro/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MediaOrganizerPro media_organizer_pro/media_organizer_pro.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MediaOrganizerPro-windows-x86_64
          path: dist/MediaOrganizerPro.exe
          if-no-files-found: error

  linux:
    name: Linux Packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libglib2.0-0 desktop-file-utils dpkg-dev wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r media_organizer_pro/requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MediaOrganizerPro media_organizer_pro/media_organizer_pro.py

      - name: Create generated icon
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path("build_assets")
          out.mkdir(exist_ok=True)
          img = Image.new("RGB", (256, 256), "#0b1020")
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle((22, 22, 234, 234), radius=38, fill="#0ea5e9")
          draw.rounded_rectangle((48, 48, 208, 208), radius=24, outline="#ffffff", width=8)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 74)
          text = "MO"
          box = draw.textbbox((0, 0), text, font=font)
          x = (256 - (box[2] - box[0])) / 2
          y = (256 - (box[3] - box[1])) / 2 - 4
          draw.text((x, y), text, fill="#ffffff", font=font)
          img.save(out / "media-organizer-pro.png")
          PY

      - name: Create tar.gz
        run: |
          mkdir -p package/tar/MediaOrganizerPro
          cp dist/MediaOrganizerPro package/tar/MediaOrganizerPro/MediaOrganizerPro
          cp media_organizer_pro/README.md package/tar/MediaOrganizerPro/README.md
          tar -czf MediaOrganizerPro-linux-x86_64.tar.gz -C package/tar MediaOrganizerPro

      - name: Create DEB
        run: |
          mkdir -p package/deb/DEBIAN
          mkdir -p package/deb/usr/bin
          mkdir -p package/deb/usr/share/applications
          mkdir -p package/deb/usr/share/icons/hicolor/256x256/apps
          cp dist/MediaOrganizerPro package/deb/usr/bin/media-organizer-pro
          cp build_assets/media-organizer-pro.png package/deb/usr/share/icons/hicolor/256x256/apps/media-organizer-pro.png
          cat > package/deb/DEBIAN/control <<'EOF'
          Package: media-organizer-pro
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: danijel0304
          Description: Desktop media organizer and duplicate finder.
          EOF
          cat > package/deb/usr/share/applications/media-organizer-pro.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Media Organizer Pro
          Comment=Organize photos and videos and find duplicates
          Exec=media-organizer-pro
          Icon=media-organizer-pro
          Terminal=false
          Categories=Utility;Graphics;AudioVideo;
          EOF
          chmod 0755 package/deb/usr/bin/media-organizer-pro
          dpkg-deb --build package/deb MediaOrganizerPro-linux-x86_64.deb

      - name: Create AppImage
        run: |
          mkdir -p package/AppDir/usr/bin
          mkdir -p package/AppDir/usr/share/applications
          mkdir -p package/AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/MediaOrganizerPro package/AppDir/usr/bin/media-organizer-pro
          cp build_assets/media-organizer-pro.png package/AppDir/media-organizer-pro.png
          cp build_assets/media-organizer-pro.png package/AppDir/.DirIcon
          cp build_assets/media-organizer-pro.png package/AppDir/usr/share/icons/hicolor/256x256/apps/media-organizer-pro.png
          cat > package/AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/media-organizer-pro" "$@"
          EOF
          cat > package/AppDir/media-organizer-pro.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Media Organizer Pro
          Comment=Organize photos and videos and find duplicates
          Exec=media-organizer-pro
          Icon=media-organizer-pro
          Terminal=false
          Categories=Utility;Graphics;AudioVideo;
          EOF
          chmod +x package/AppDir/AppRun package/AppDir/usr/bin/media-organizer-pro
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool package/AppDir MediaOrganizerPro-linux-x86_64.AppImage || (
            ./appimagetool --appimage-extract
            ARCH=x86_64 ./squashfs-root/AppRun package/AppDir MediaOrganizerPro-linux-x86_64.AppImage
          )

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaOrganizerPro-linux-x86_64
          path: |
            MediaOrganizerPro-linux-x86_64.tar.gz
            MediaOrganizerPro-linux-x86_64.deb
            MediaOrganizerPro-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - windows
      - linux

    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Media Organizer Pro ${{ steps.version.outputs.tag }}
          body: |
            Media Organizer Pro desktop builds.

            Artifacts:
            - Windows EXE
            - Linux AppImage
            - Linux tar.gz
            - Linux deb
          files: release-artifacts/**/*
